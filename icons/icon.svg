<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="256" cy="256" r="235" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a9d4ff" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#7fb8ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <!-- Vierzackiger Funkel-Stern, wie die hellen Sterne im Hintergrund. -->
    <path id="stern" d="M0 -1 C0.06 -0.264 0.264 -0.06 1 0 C0.264 0.06 0.06 0.264 0 1 C-0.06 0.264 -0.264 0.06 -1 0 C-0.264 -0.06 -0.06 -0.264 0 -1 Z"/>
  </defs>

  <rect width="512" height="512" fill="#000000"/>
  <circle cx="256" cy="256" r="235" fill="url(#glow)"/>

  <g transform="translate(256,256) scale(182)">
    <use href="#stern" fill="#ffffff" filter="url(#soft)" opacity="0.6"/>
    <use href="#stern" fill="#ffffff" stroke="#ffffff" stroke-width="0.004" stroke-linejoin="round"/>
  </g>

  <use href="#stern" transform="translate(404,118) scale(34)" fill="#ffffff" opacity="0.9"/>
  <use href="#stern" transform="translate(110,404) scale(24)" fill="#ffffff" opacity="0.7"/>
  <use href="#stern" transform="translate(412,388) scale(16)" fill="#ffffff" opacity="0.6"/>
</svg>
