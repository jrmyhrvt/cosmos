<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#000000" />
<title>COSMOS</title>
<link rel="stylesheet" href="css/cosmos.css" />
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
</head>
<body>
<canvas id="stars"></canvas>

<div class="app">
  <header>
    <div class="brand" id="brandBtn">COSMOS</div>
    <div class="utc-container">
      <button class="tz-btn" onclick="changeOffset(-1)">-</button>
      <span class="tz-display" id="tzDisplay">UTC+2</span>
      <button class="tz-btn" onclick="changeOffset(1)">+</button>
      <div class="utc-pill" id="utcClock">--:--:--</div>
    </div>
  </header>

  <main>
    <section class="view home active" id="home">
      <div class="hero">
        <div class="eyebrow" data-i18n="eyebrow">Dein Fenster ins Universum</div>
        <div class="star-word" id="starWord" aria-hidden="true"></div>
        <div class="sub" data-i18n="sub">Verfolge kosmische Momente. Tippe auf ein Ereignis, um das Universum zu erkunden.</div>
        
        <div class="lang-selector-box">
          <button class="lang-btn active" data-lang="de" onclick="setLanguage('de')">DE</button>
          <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
          <button class="lang-btn" data-lang="es" onclick="setLanguage('es')">ES</button>
        </div>
      </div>
    </section>

    <section class="view" id="live-view">
      <div id="live-view-main">
        <div class="section-head">
          <div><div class="eyebrow" style="margin-bottom:9px" data-i18n="sec_live_eyebrow">Echtzeit & Aktiv</div><h1 data-i18n="sec_live_title">Live-Ereignisse</h1></div>
        </div>
        <div class="event-list" id="liveEventList"></div>
      </div>
      <div class="detail-page" id="live-view-detail"></div>
    </section>

    <section class="view" id="events">
      <div id="events-main">
        <div class="search-sticky">
          <input type="text" class="search-input" id="searchEvents" data-i18n-placeholder="search_events" placeholder="Ereignisse durchsuchen..." />
        </div>
        <div class="section-head">
          <div><div class="eyebrow" style="margin-bottom:9px" data-i18n="sec_events_eyebrow">Space-Calendar-Feed</div><h1 data-i18n="sec_events_title">Ereignisse</h1></div>
          <span id="eventCount"></span>
        </div>
        <div class="update-info" id="updateInfo" data-i18n="loading">Daten werden geladen...</div>
        <div class="event-list" id="eventList"></div>
      </div>
      <div class="detail-page" id="events-detail"></div>
    </section>

    <section class="view" id="history">
      <div id="history-main">
        <div class="search-sticky">
          <input type="text" class="search-input" id="searchHistory" data-i18n-placeholder="search_history" placeholder="Verlauf durchsuchen..." />
        </div>
        <div class="section-head">
          <div><div class="eyebrow" style="margin-bottom:9px" data-i18n="sec_hist_eyebrow">Vergangene Meilensteine</div><h1 data-i18n="sec_hist_title">Verlauf</h1></div>
        </div>
        <div class="hist-list" id="histList"></div>
      </div>
      <div class="detail-page" id="history-detail"></div>
    </section>

    <section class="view" id="glostar">
      <div id="glostar-main">
        <div class="search-sticky">
          <input type="text" class="search-input" id="searchGloStar" data-i18n-placeholder="search_glostar" placeholder="Begriffe im GloStar suchen..." />
        </div>
        <div class="section-head">
          <div><div class="eyebrow" style="margin-bottom:9px" data-i18n="sec_glostar_eyebrow">Astro-Lexikon</div><h1 data-i18n="sec_glostar_title">GloStar</h1></div>
        </div>
        <div class="glostar-list" id="glostarGrid"></div>
      </div>
      <div class="detail-page" id="glostar-detail"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M3.5 11.2 12 4l8.5 7.2v8.3a1.5 1.5 0 0 1-1.5 1.5h-5v-6H10v6H5a1.5 1.5 0 0 1-1.5-1.5z"/></svg>
      <span data-i18n="home">Home</span>
    </button>
    <button class="tab" data-tab="live-view">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2a10 10 0 1 0 10 10"/></svg>
      <span data-i18n="live">Live</span>
    </button>
    <button class="tab" data-tab="events">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg>
      <span data-i18n="events">Ereignisse</span>
    </button>
    <button class="tab" data-tab="history">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4.5H7.5"/><path d="M12 7.5v5l3.2 2"/></svg>
      <span data-i18n="history">Verlauf</span>
    </button>
    <button class="tab" data-tab="glostar">
      <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span data-i18n="glostar">GloStar</span>
    </button>
  </nav>
</div>

<!-- satellite.js (SGP4-Bahnrechnung, MIT). Muss vor den Modulen kommen,
     weil es sich als globales "satellite" anmeldet. -->
<script src="js/iss/vendor/satellite.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
